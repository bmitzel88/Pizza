<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="Stylesheet" href="styles/pizza-styles.css"> 

    <!-- Favicon for the website -->
    <link rel="icon" href="images/pizza.png" type="image/png">
    <title>PizzaShop</title>
</head>
<body>
    <div id="main">
        <div id="header">
            <img src="images/pizza-logo.png" alt="Pizza">
            <h1>Poppa's Pizza</h1>
            <h2>Serving GRC for 50 years!</h2>
            <hr>
            <p>We make the best pizzas ever. Visit us today!</p>
            <a id="contact-button" href="#" role="button">Contact Us</a>
        </div>

        <form id="pizza-form" action="#" method="get">
            <!-- Contact info -->
             <fieldset>
                <legend>Contact Info</legend>
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname">
                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
             </fieldset>
             
            <!-- Pickup or Delivery -->
             <fieldset>
                <legend>Select Pickup or Delivery</legend>
                <label for="pickup">
                    <input type="radio" id="pickup" name="method"> <!--Needs to have same name to not have both be able to be selected at same time-->
                    Pickup
                </label>
                <label for="delivery">
                    <input type="radio" id="delivery" name="method">
                    Delivery
                </label>
             </fieldset>
            <!-- Select Toppings -->
             <fieldset>
                <legend>Select Toppings</legend>
                <label for="pepperoni">
                    <input type="checkbox" id="pepperoni"
                        name="toppings[]" value="pepperoni">
                    Pepperoni
                </label>
                <label for="olives">
                    <input type="checkbox" id="olives"
                        name="toppings[]" value="olives">
                    Olives
                </label>
                <label for="bacon">
                    <input type="checkbox" id="bacon"
                        name="toppings[]" value="bacon">
                    Bacon
                </label>
             </fieldset>
             <!-- Pizza Size -->
             <fieldset>
                <legend>Select Pizza Size</legend>
                <label for="pizza-size">
                    <select id="size" name="size">
                        <option value="none">Select a Size</option>
                        <option value="small">Small</option>
                        <option value="medium">Medium</option>
                        <option value="large">Large</option>
                    </select>
                </label>
             </fieldset>
             <!-- Comment Field -->
              <label for="comment">Comments</label>
              <textarea rows="5" id="comment" name="comment"></textarea>


             <!-- Order Button -->
             <button type="submit" id="order-button">Place Order</button>
        </form>

    </div>
</body>
</html>
